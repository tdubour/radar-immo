name: Radar quotidien
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-daily-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run collect
      - name: Commit data changes
        run: |
          git config user.name "radar-immo-bot"
          git config user.email "radar-immo-bot@users.noreply.github.com"
          git add data/listings.json data/history.json data/status.json
          git diff --cached --quiet || git commit -m "data: mise à jour quotidienne des annonces"
          git push
